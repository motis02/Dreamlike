<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机梦境生成器 🌙</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>✨ 随机梦境生成器</h1>
            <p class="subtitle">点击按钮，收获一个专属于你的奇妙梦境</p>
        </header>

        <div class="dream-card">
            <div class="dream-image">
                <!-- 这里可以替换成你对接的AI绘画接口返回的图片，先用之前生成的梦幻示例图占位 -->
                <img src="https://p3-flow-imagex-sign.byteimg.com/ocean-cloud-tos/91e08108809c401899777a700400c233~tplv-a9rns2rl98-image.png?rk3s=8278185b&x-expires=1762920527&x-signature=o%2F%2B6%2B7%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F%2F" alt="专属梦境插画">
            </div>

            <div class="dream-content">
                <div class="dream-id">梦境编号：{{ dream_id }}</div>
                <div class="dream-text">
                    {{ dream_text }}
                </div>
                <div class="prompt-tip">
                    <small>本次梦境生成提示词：{{ image_prompt }}</small>
                </div>
            </div>

            <div class="action-area">
                <a href="/" class="btn-generate">🎲 生成新的梦境</a>
            </div>
        </div>

        <footer class="footer">
            <p>Made with 💜 | 每一个梦境都是独一无二的小惊喜</p>
        </footer>
    </div>
</body>
</html>
